  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  window.addEventListener('error', function(e) {
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

yle=\"color:var(--ac)\">[04]<\u002Fspan> Ten places<br>worth your day<\u002Fh2>\n      <span style=\"font-family:'Victor Mono',monospace;font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--dim);text-align:right\">NUMBERS REUSED<br>IN THE PLANNER<\u002Fspan>\n    <\u002Fdiv>\n    <div id=\"places\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));border-left:1px solid #0A0A0A\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"s-quarters\" data-sec=\"Quarters\" data-screen-label=\"05 QUARTERS\" style=\"border-bottom:1px solid #0A0A0A\">\n    <div data-head=\"\" style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:10px;border-bottom:1px solid #0A0A0A\">\n      <h2 style=\"margin:0;font-weight:700;font-size:clamp(20px,5.2vw,46px);line-height:0.86;letter-spacing:-0.045em;text-transform:uppercase\"><span style=\"color:var(--ac)\">[05]<\u002Fspan> Quarters<br>index<\u002Fh2>\n      <span style=\"font-family:'Victor Mono',monospace;font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--dim);text-align:right\">EIGHT QUARTERS<br>TIER + CHARACTER<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"overflow-x:auto\"><div id=\"quarters\" style=\"min-width:620px\"><\u002Fdiv><\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"s-history\" data-sec=\"History\" data-screen-label=\"06 HISTORY\" style=\"border-bottom:1px solid #0A0A0A\">\n    <div data-head=\"\" style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:10px;border-bottom:1px solid #0A0A0A\">\n      <h2 style=\"margin:0;font-weight:700;font-size:clamp(20px,5.2vw,46px);line-height:0.86;letter-spacing:-0.045em;text-transform:uppercase\"><span style=\"color:var(--ac)\">[06]<\u002Fspan> Six moments<br>that built it<\u002Fh2>\n      <span style=\"font-family:'Victor Mono',monospace;font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--dim);text-align:right\">ALL SIX VISITABLE<br>ON FOOT<\u002Fspan>\n    <\u002Fdiv>\n    <div id=\"history\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"s-around\" data-sec=\"Transit\" data-screen-label=\"07 TRANSIT\" style=\"border-bottom:1px solid #0A0A0A\">\n    <div data-head=\"\" style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:10px;border-bottom:1px solid #0A0A0A\">\n      <h2 style=\"margin:0;font-weight:700;font-size:clamp(20px,5.2vw,46px);line-height:0.86;letter-spacing:-0.045em;text-transform:uppercase\"><span style=\"color:var(--ac)\">[07]<\u002Fspan> Getting around<br>and eating well<\u002Fh2>\n      <span style=\"font-family:'Victor Mono',monospace;font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--dim);text-align:right\">ONE CARD COVERS<br>EVERY MODE<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(276px,1fr))\">\n      <div style=\"padding:12px 10px;border-right:1px solid #0A0A0A;border-bottom:1px solid #0A0A0A\">\n        <div style=\"font-family:'Victor Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;margin-bottom:8px\">MOVING BETWEEN TIERS<\u002Fdiv>\n        <div style=\"display:grid;font-family:'Victor Mono',monospace;font-size:11px;text-transform:uppercase\">\n          <div style=\"display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #DAD7D0\"><span style=\"color:var(--dim)\">SUB-RAIL<\u002Fspan><span>4 LINES, 6 KR FLAT<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #DAD7D0\"><span style=\"color:var(--dim)\">PUBLIC LIFTS<\u002Fspan><span>31 TOWERS, 4 KR<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #DAD7D0\"><span style=\"color:var(--dim)\">FUNICULAR<\u002Fspan><span>SOUTH WALL, 8 KR<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #DAD7D0\"><span style=\"color:var(--dim)\">CABLE CAR<\u002Fspan><span>12 KR RETURN<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #DAD7D0\"><span style=\"color:var(--dim)\">RIVER FERRY<\u002Fspan><span>EVERY 12 MIN, 5 KR<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:12px;padding:6px 0\"><span style=\"color:var(--dim)\">DAY PASS<\u002Fspan><span>28 KR, ALL MODES<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:10px 0 0;font-size:13px;line-height:1.6\">Ask for the nearest station, not the street. Addresses repeat on every tier and even taxi drivers navigate by station name.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:12px 10px;border-right:1px solid #0A0A0A;border-bottom:1px solid #0A0A0A;background:rgba(10,10,10,0.05)\">\n        <div style=\"font-family:'Victor Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;margin-bottom:8px\">FOUR THINGS TO EAT<\u002Fdiv>\n        <div style=\"display:grid;gap:9px\">\n          <div><div style=\"font-weight:700;font-size:13.5px;text-transform:uppercase;letter-spacing:-0.02em\">Gorge trout, 22 kr<\u002Fdiv><div style=\"font-size:13px;line-height:1.55\">Split, salted, cooked over charcoal at the night market.<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-weight:700;font-size:13.5px;text-transform:uppercase;letter-spacing:-0.02em\">Stair noodles, 18 kr<\u002Fdiv><div style=\"font-size:13px;line-height:1.55\">Hand-pulled, brown broth, a whole chilli-oil ritual. Every third kitchen on the Lantern Stairs.<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-weight:700;font-size:13.5px;text-transform:uppercase;letter-spacing:-0.02em\">Pear wine, cold<\u002Fdiv><div style=\"font-size:13px;line-height:1.55\">From the inland terraces, poured from steel jugs. Ask for the unfiltered one.<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-weight:700;font-size:13.5px;text-transform:uppercase;letter-spacing:-0.02em\">Tier-three buns, 6 kr<\u002Fdiv><div style=\"font-size:13px;line-height:1.55\">Sweet-savoury pork buns from housing-block ground floors before 09:00.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:12px 10px;border-bottom:1px solid #0A0A0A\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;font-family:'Victor Mono',monospace;font-size:9.5px;letter-spacing:0.14em;text-transform:uppercase\">\n          <span style=\"font-weight:600\">WHEN TO COME<\u002Fspan><span style=\"color:var(--dim)\">RAINFALL<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:flex-end;gap:2px;height:88px;border-bottom:1px solid #0A0A0A\">\n          <span style=\"flex:1;height:74%;background:#0A0A0A\"><\u002Fspan><span style=\"flex:1;height:81%;background:#0A0A0A\"><\u002Fspan><span style=\"flex:1;height:96%;background:#0A0A0A\"><\u002Fspan><span style=\"flex:1;height:88%;background:#0A0A0A\"><\u002Fspan>\n          <span style=\"flex:1;height:62%;background:var(--ac)\"><\u002Fspan><span style=\"flex:1;height:41%;background:var(--ac)\"><\u002Fspan><span style=\"flex:1;height:29%;background:var(--ac)\"><\u002Fspan><span style=\"flex:1;height:24%;background:var(--ac)\"><\u002Fspan><span style=\"flex:1;height:38%;background:var(--ac)\"><\u002Fspan>\n          <span style=\"flex:1;height:57%;background:#0A0A0A\"><\u002Fspan><span style=\"flex:1;height:69%;background:#0A0A0A\"><\u002Fspan><span style=\"flex:1;height:78%;background:#0A0A0A\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;margin-top:4px;font-family:'Victor Mono',monospace;font-size:9.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--dim)\"><span>JAN<\u002Fspan><span>APR<\u002Fspan><span>JUL<\u002Fspan><span>OCT<\u002Fspan><span>DEC<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:10px 0 0;font-size:13px;line-height:1.6\">Wet October to April, with a flood week on the quays most Marches. Dry, hazy and warm May to September. Late summer evenings are what the city is built for.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"s-light\" data-sec=\"Light\" data-screen-label=\"LIGHT WINDOW\" style=\"border-bottom:1px solid #0A0A0A\">\n    <div data-head=\"\" style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:10px;border-bottom:1px solid #0A0A0A\">\n      <h2 style=\"margin:0;font-weight:700;font-size:clamp(20px,5.2vw,46px);line-height:0.86;letter-spacing:-0.045em;text-transform:uppercase\"><span style=\"color:var(--ac)\">[LX]<\u002Fspan> Light<br>window<\u002Fh2>\n      <span style=\"font-family:'Victor Mono',monospace;font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--dim);text-align:right\">WHEN THE CITY<br>LOOKS LIKE ITSELF<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"margin:0;padding:9px 10px;border-bottom:1px solid #0A0A0A;font-size:13.5px;line-height:1.55;max-width:74ch\">Pick a month. The console returns the hour the gorge fills with light, the hour the tower crowns switch on, and where to stand for each.<\u002Fp>\n    <div id=\"lightMonths\" style=\"display:flex;flex-wrap:nowrap;gap:5px;overflow-x:auto;scrollbar-width:none;padding:8px 10px;border-bottom:1px solid #0A0A0A\"><\u002Fdiv>\n    <div id=\"lightOut\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))\"><\u002Fdiv>\n    <div style=\"padding:10px;border-top:1px solid #0A0A0A\">\n      <div id=\"lightBand\" style=\"display:flex;height:26px;border:1px solid #0A0A0A;overflow:hidden\"><\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;margin-top:4px;font-family:'Victor Mono',monospace;font-size:9.5px;letter-spacing:0.1em;color:var(--dim)\"><span>00:00<\u002Fspan><span>06:00<\u002Fspan><span>12:00<\u002Fspan><span>18:00<\u002Fspan><span>24:00<\u002Fspan><\u002Fdiv>\n      <div id=\"lightLegend\" style=\"display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:7px;font-family:'Victor Mono',monospace;font-size:9.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--dim)\"><\u002Fdiv>\n      <div id=\"lightNote\" style=\"margin-top:8px;font-size:13.5px;line-height:1.55;max-width:70ch\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"s-match\" data-sec=\"Mood\" data-screen-label=\"MOOD MATCH\" style=\"border-bottom:1px solid #0A0A0A\">\n    <div data-head=\"\" style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:10px;border-bottom:1px solid #0A0A0A\">\n      <h2 style=\"margin:0;font-weight:700;font-size:clamp(20px,5.2vw,46px);line-height:0.86;letter-spacing:-0.045em;text-transform:uppercase\"><span style=\"color:var(--ac)\">[MX]<\u002Fspan> What are you<br>in the mood for<\u002Fh2>\n      <span style=\"font-family:'Victor Mono',monospace;font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--dim);text-align:right\">PICK UP TO THREE,<br>SORTED BY THE HOUR<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"margin:0;padding:9px 10px;border-bottom:1px solid #0A0A0A;font-size:13.5px;line-height:1.55;max-width:74ch\">The atlas reads the Pacific clock and answers with the three stops that fit both what you want and the hour it is now. Send any of them straight into the planner below.<\u002Fp>\n    <div id=\"moodPicks\" style=\"display:flex;flex-wrap:wrap;gap:5px;padding:8px 10px;border-bottom:1px solid #0A0A0A\"><\u002Fdiv>\n    <div id=\"moodOut\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"s-plan\" data-sec=\"Planner\" data-screen-label=\"08 PLANNER\" style=\"border-bottom:1px solid #0A0A0A\">\n    <div data-head=\"\" style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:10px;border-bottom:1px solid #0A0A0A\">\n      <h2 style=\"margin:0;font-weight:700;font-size:clamp(20px,5.2vw,46px);line-height:0.86;letter-spacing:-0.045em;text-transform:uppercase\"><span style=\"color:var(--ac)\">[08]<\u002Fspan> Build<br>your day<\u002Fh2>\n      <span style=\"font-family:'Victor Mono',monospace;font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--dim);text-align:right\">PICK STOPS,<br>GET TIME + COST<\u002Fspan>\n    <\u002Fdiv>\n    <div id=\"planpicks\" style=\"display:flex;flex-wrap:wrap;border-bottom:1px solid #0A0A0A\"><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));border-bottom:1px solid #0A0A0A\">\n      <div style=\"padding:10px;border-right:1px solid #0A0A0A\"><div style=\"font-family:'Victor Mono',monospace;font-size:9.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--dim)\">STOPS<\u002Fdiv><div id=\"planCount\" style=\"font-weight:700;font-size:26px;letter-spacing:-0.04em;margin-top:2px\">0<\u002Fdiv><\u002Fdiv>\n      <div style=\"padding:10px;border-right:1px solid #0A0A0A\"><div style=\"font-family:'Victor Mono',monospace;font-size:9.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--dim)\">TIME<\u002Fdiv><div id=\"planTime\" style=\"font-weight:700;font-size:26px;letter-spacing:-0.04em;margin-top:2px\">0 h<\u002Fdiv><\u002Fdiv>\n      <div style=\"padding:10px;border-right:1px solid #0A0A0A\"><div style=\"font-family:'Victor Mono',monospace;font-size:9.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--dim)\">SPEND / PERSON<\u002Fdiv><div id=\"planCost\" style=\"font-weight:700;font-size:26px;letter-spacing:-0.04em;margin-top:2px\">0 kr<\u002Fdiv><\u002Fdiv>\n      <div style=\"padding:10px;background:var(--ac);color:#fff\"><div style=\"font-family:'Victor Mono',monospace;font-size:9.5px;letter-spacing:0.12em;text-transform:uppercase\">VERDICT<\u002Fdiv><div id=\"planVerdict\" style=\"font-weight:700;font-size:15px;line-height:1.15;letter-spacing:-0.02em;text-transform:uppercase;margin-top:5px\">Pick a stop<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:12px 10px;display:grid;gap:8px\">\n      <div style=\"font-family:'Victor Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase\">ROUTE, IN THE ORDER THAT WORKS<\u002Fdiv>\n      <ol id=\"planList\" style=\"margin:0;padding-left:18px;display:grid;gap:4px;font-size:13.5px;line-height:1.5\"><\u002Fol>\n      <div id=\"planEmpty\" style=\"font-size:13.5px;line-height:1.55;color:#57544C\">Nothing picked yet. Tap the numbered stops above and this becomes a walkable order with a running total. Transit is charged at the 28 kr day pass once you pick three or more stops.<\u002Fdiv>\n      <button id=\"planReset\" type=\"button\" style=\"justify-self:start;min-height:44px;padding:0 14px;font-family:'Victor Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#0A0A0A;background:transparent;border:1px solid #0A0A0A;cursor:pointer\">CLEAR THE DAY<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"s-words\" data-sec=\"Kaelic\" data-screen-label=\"09 KAELIC\" style=\"border-bottom:1px solid #0A0A0A\">\n    <div data-head=\"\" style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:10px;border-bottom:1px solid #0A0A0A\">\n      <h2 style=\"margin:0;font-weight:700;font-size:clamp(20px,5.2vw,46px);line-height:0.86;letter-spacing:-0.045em;text-transform:uppercase\"><span style=\"color:var(--ac)\">[09]<\u002Fspan> Essential<br>Kaelic<\u002Fh2>\n      <span style=\"font-family:'Victor Mono',monospace;font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--dim);text-align:right\">TAP A WORD FOR<br>PRONUNCIATION<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"margin:0;padding:10px;border-bottom:1px solid #0A0A0A;font-size:13.5px;line-height:1.6;max-width:74ch\">Kaelic is a port creole: English grammar, Latin left by the customs clerks, French left by the shipping houses. Twelve words cover a whole visit, and everything else can be said in English.<\u002Fp>\n    <div id=\"dict\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"s-know\" data-sec=\"Notes\" data-screen-label=\"10 NOTES\" style=\"border-bottom:1px solid #0A0A0A\">\n    <div data-head=\"\" style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:10px;border-bottom:1px solid #0A0A0A\">\n      <h2 style=\"margin:0;font-weight:700;font-size:clamp(20px,5.2vw,46px);line-height:0.86;letter-spacing:-0.045em;text-transform:uppercase\"><span style=\"color:var(--ac)\">[10]<\u002Fspan> Know<br>before you go<\u002Fh2>\n      <span style=\"font-family:'Victor Mono',monospace;font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--dim);text-align:right\">HONEST NOTES,<br>NOT WARNINGS<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));border-left:1px solid #0A0A0A\">\n      <div style=\"border-right:1px solid #0A0A0A;border-bottom:1px solid #0A0A0A;padding:12px 10px\"><div style=\"font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:-0.025em;margin-bottom:5px\">You are on camera<\u002Fdiv><p style=\"margin:0;font-size:13px;line-height:1.6\">One of the most monitored cities on the coast, with biometric gates on transit and camera panels on every tier. Visitors are rarely bothered by it. Carry your entry document and expect face checks at station barriers.<\u002Fp><\u002Fdiv>\n      <div style=\"border-right:1px solid #0A0A0A;border-bottom:1px solid #0A0A0A;padding:12px 10px\"><div style=\"font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:-0.025em;margin-bottom:5px\">Two quarters to skip<\u002Fdiv><p style=\"margin:0;font-size:13px;line-height:1.6\">The eastern tenement blocks and the industrial yards behind Power Node 4 are closed to visitors and policed unpredictably. There is nothing there for a traveller, whatever older guidebooks claim.<\u002Fp><\u002Fdiv>\n      <div style=\"border-right:1px solid #0A0A0A;border-bottom:1px solid #0A0A0A;padding:12px 10px\"><div style=\"font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:-0.025em;margin-bottom:5px\">Power cuts happen<\u002Fdiv><p style=\"margin:0;font-size:13px;line-height:1.6\">Short outages hit the eastern tiers most weeks, usually under twenty minutes. Lifts stop, stair lighting stays on. Keep a torch, and do not be in a tower lift at 21:00.<\u002Fp><\u002Fdiv>\n      <div style=\"border-right:1px solid #0A0A0A;border-bottom:1px solid #0A0A0A;padding:12px 10px\"><div style=\"font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:-0.025em;margin-bottom:5px\">Manners on the stairs<\u002Fdiv><p style=\"margin:0;font-size:13px;line-height:1.6\">Stairways are streets and also front rooms. Climb on the right, ask before photographing a kitchen, pay in cash. Tipping is not expected. Ordering a second dish is.<\u002Fp><\u002Fdiv>\n      <div style=\"border-right:1px solid #0A0A0A;border-bottom:1px solid #0A0A0A;padding:12px 10px\"><div style=\"font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:-0.025em;margin-bottom:5px\">Air on hazy days<\u002Fdiv><p style=\"margin:0;font-size:13px;line-height:1.6\">Industrial haze settles in the gorge in high summer. Upper tiers are always clearer than the quays, which is a good reason to plan mornings low and evenings high.<\u002Fp><\u002Fdiv>\n      <div style=\"border-right:1px solid #0A0A0A;border-bottom:1px solid #0A0A0A;padding:12px 10px;background:#0A0A0A;color:#F2F1EE\"><div style=\"font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:-0.025em;margin-bottom:5px;color:var(--ac)\">Three perfect days<\u002Fdiv><p style=\"margin:0;font-size:13px;line-height:1.6\">Day one: quays, the Stacks, night market. Day two: Upper Spine bridges, cable car, Skyline Terrace at sunset. Day three: Old Customs Quarter, archive dome, then Pine Ridge Park to end quietly.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"s-gallery\" data-sec=\"Gallery\" data-screen-label=\"11 GALLERY\" style=\"border-bottom:1px solid #0A0A0A\">\n    <div style=\"display:flex;align-items:flex-start;gap:8px;padding:10px 10px 0\">\n      <h2 style=\"margin:0;flex:1;font-weight:700;font-size:clamp(32px,11.5vw,164px);line-height:0.8;letter-spacing:-0.06em;text-transform:uppercase\">Gallery<\u002Fh2>\n      <span style=\"font-family:'Victor Mono',monospace;font-size:clamp(17px,4.6vw,44px);line-height:0.8;color:var(--ac)\">↘<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px 24px;padding:8px 10px 12px;border-bottom:1px solid #0A0A0A\">\n      <p style=\"margin:0;font-size:13.5px;line-height:1.55;text-align:justify;text-wrap:pretty\">The city as it actually looks, photographed by the people who live in it: gorge fog swallowing the second expressway deck at first light, and the north terrace parapets at the hour the sun comes off the tower glass. Prints are pulled from the municipal negative archive.<\u002Fp>\n      <div style=\"font-family:'Victor Mono',monospace;font-size:10px;letter-spacing:0.06em;text-transform:uppercase;color:var(--dim);display:grid;gap:3px;align-content:start\">\n        <div style=\"display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #DAD7D0;padding-bottom:3px\"><span>ITEMS IN ARCHIVE<\u002Fspan><span style=\"color:#0A0A0A\">6,800<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #DAD7D0;padding-bottom:3px\"><span>PLATES SHOWN<\u002Fspan><span id=\"galcount\" style=\"color:#0A0A0A\">3<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;gap:12px\"><span>FORMAT<\u002Fspan><span style=\"color:#0A0A0A\">SILVER / DIGITAL<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div id=\"galgrid\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;padding:14px 10px 18px\"><\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;padding:9px 10px;border-top:1px solid #0A0A0A;font-family:'Victor Mono',monospace;font-size:9.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--dim)\">\n      <span>TAP A PLATE TO OPEN IT FULL SIZE / ← → TO MOVE BETWEEN PLATES<\u002Fspan>\n      <a href=\"#s-cover\">BACK TO TOP ↑<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"s-colophon\" data-screen-label=\"COLOPHON\" style=\"border-bottom:1px solid #0A0A0A;padding:18px 10px 22px\">\n    <div style=\"background:rgba(255,255,255,0.42);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);border:1px solid rgba(10,10,10,0.22);padding:16px 14px 18px;max-width:960px\">\n      <div style=\"font-family:'Victor Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:var(--ac);margin-bottom:8px\">COLOPHON / WHO MADE THIS<\u002Fdiv>\n      <h2 style=\"margin:0 0 10px;font-weight:700;font-size:clamp(19px,4.4vw,34px);line-height:0.92;letter-spacing:-0.04em;text-transform:uppercase\">This atlas was built<br>by the people who live here<\u002Fh2>\n      <p style=\"margin:0 0 10px;font-size:14px;line-height:1.6;max-width:70ch;text-wrap:pretty\">There is no tourism ministry behind this. Vesperia has a Bureau of Visitor Revenue, and it publishes figures: arrivals, spend per head, hotel occupancy on the upper tiers. It does not publish a map of the stairs, or opening hours for a kitchen on the Lantern Slope, or the fact that the archive's lower vault has been sealed since 1998.<\u002Fp>\n      <p style=\"margin:0 0 12px;font-size:14px;line-height:1.6;max-width:70ch;text-wrap:pretty\">So the rest of us wrote it. Photographs from residents of Halstead and Lantern Slope, timetables checked on foot, prices confirmed the week of publication, corrections taken from anyone who finds one. <mark style=\"background:var(--ac);color:#fff;padding:0 3px\">The state counts what the city earns. The city keeps count of everything else.<\u002Fmark><\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;font-family:'Victor Mono',monospace;font-size:10px;letter-spacing:0.06em;text-transform:uppercase;color:var(--dim);border-top:1px solid rgba(10,10,10,0.22);padding-top:10px\">\n        <div><div style=\"color:#0A0A0A\">MAINTAINED BY<\u002Fdiv><div>KAELEN OPEN ATLAS COLLECTIVE<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"color:#0A0A0A\">CONTRIBUTORS<\u002Fdiv><div>218 RESIDENTS, 11 TIERS<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"color:#0A0A0A\">FUNDING<\u002Fdiv><div>NONE. NO STATE, NO SPONSOR<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"color:#0A0A0A\">CORRECTIONS<\u002Fdiv><div>OPEN TO ANYONE WHO WALKS IT<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;padding:12px 10px;font-family:'Victor Mono',monospace;font-size:9.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--dim)\">\n    <span>NOVA KAELEN ATLAS / UNITED REPUBLIC OF VESPERIA<\u002Fspan>\n    <span>PRICES AND TIMETABLES CHANGE, CHECK LOCALLY<\u002Fspan>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1F4FD8&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#1F4FD8&quot;,&quot;#0B2FA8&quot;,&quot;#3B82F6&quot;,&quot;#0A0A0A&quot;],&quot;section&quot;:&quot;Look&quot;},&quot;invert&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Look&quot;},&quot;galleryStacked&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Gallery&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() { this.applyProps(); this.wire(); }\n  componentDidUpdate() { this.applyProps(); this.wire(); }\n\n  teardown(root) {\n    if (root.__nkScroll) { window.removeEventListener('scroll', root.__nkScroll); root.__nkScroll = null; }\n    if (this._onKey) window.removeEventListener('keydown', this._onKey);\n    if (this._liveTimer) clearInterval(this._liveTimer);\n    document.body.style.overflow = '';\n    ['#topnav', '#chips', '#ixPanel', '#toc', '#tiers', '#places', '#quarters', '#history', '#planpicks', '#dict', '#liveGrid', '#lightMonths', '#moodPicks', '#moodOut', '#galgrid'].forEach((s) => {\n      const el = root.querySelector(s);\n      if (el) el.innerHTML = '';\n    });\n    const old = root.querySelector('[data-lightbox]');\n    if (old) old.remove();\n  }\n  componentWillUnmount() {\n    if (this._onScroll) window.removeEventListener('scroll', this._onScroll);\n    if (this._liveTimer) clearInterval(this._liveTimer);\n    if (this._onKey) window.removeEventListener('keydown', this._onKey);\n    document.body.style.overflow = '';\n  }\n\n  applyProps() {\n    const root = document.getElementById('atlas');\n    if (!root) return;\n    root.style.setProperty('--ac', this.props.accent || '#1F4FD8');\n    if (this.props.invert) { root.style.background = '#0A0A0A'; root.style.color = '#F2F1EE'; }\n    else { root.style.background = '#F2F1EE'; root.style.color = '#0A0A0A'; }\n    const grid = document.getElementById('galgrid');\n    if (grid) grid.style.gridTemplateColumns = this.props.galleryStacked ? '1fr' : 'repeat(auto-fit,minmax(340px,1fr))';\n  }\n\n  wire() {\n    const BUILD = 'translucent-tints-1';\n    const root = document.getElementById('atlas');\n    if (!root || root.dataset.wired === BUILD) return;\n    if (root.dataset.wired) this.teardown(root);\n    root.dataset.wired = BUILD;\n    const q = (s) => root.querySelector(s);\n    const qa = (s) => Array.from(root.querySelectorAll(s));\n    const AC = () => getComputedStyle(root).getPropertyValue('--ac').trim() || '#1F4FD8';\n    const MONO = \"'Victor Mono', monospace\";\n    const rule = '1px solid #0A0A0A';\n    const goTo = (el) => {\n      const top = Math.max(0, el.getBoundingClientRect().top + window.scrollY - 118);\n      const from = window.scrollY;\n      window.scrollTo({ top, behavior: 'smooth' });\n      setTimeout(() => { if (Math.abs(window.scrollY - from) < 2) window.scrollTo(0, top); }, 60);\n    };\n\n    const secs = qa('section[data-sec]');\n\n    /* top nav */\n    const topnav = q('#topnav');\n    secs.forEach((sec) => {\n      const b = document.createElement('button');\n      b.type = 'button';\n      b.textContent = sec.dataset.sec;\n      Object.assign(b.style, {\n        flex: '0 0 auto', minHeight: '34px', padding: '0 11px', border: '0', borderRight: rule,\n        background: 'transparent', color: '#0A0A0A', cursor: 'pointer', fontFamily: MONO,\n        fontSize: '9.5px', fontWeight: '600', letterSpacing: '0.14em', textTransform: 'uppercase', whiteSpace: 'nowrap',\n      });\n      b.addEventListener('click', () => goTo(sec));\n      topnav.appendChild(b);\n    });\n\n    /* filter chips */\n    const chipWrap = q('#chips');\n    secs.forEach((sec, i) => {\n      const b = document.createElement('button');\n      b.type = 'button';\n      b.dataset.i = String(i);\n      b.textContent = sec.dataset.sec;\n      Object.assign(b.style, {\n        flex: '0 0 auto', minHeight: '28px', padding: '0 12px', borderRadius: '999px', border: rule,\n        background: 'transparent', color: '#0A0A0A', cursor: 'pointer', fontFamily: MONO,\n        fontSize: '10px', fontWeight: '600', letterSpacing: '0.1em', textTransform: 'uppercase', whiteSpace: 'nowrap',\n      });\n      b.addEventListener('click', () => goTo(sec));\n      chipWrap.appendChild(b);\n    });\n\n    /* contents index + collapsible index panel */\n    const CODES = secs.map((s, i) => '[00-' + (i + 1) + ']');\n    const toc = q('#toc');\n    secs.forEach((sec, i) => {\n      const row = document.createElement('button');\n      row.type = 'button';\n      Object.assign(row.style, {\n        display: 'grid', gridTemplateColumns: '58px 1fr auto', gap: '10px', alignItems: 'center', width: '100%',\n        minHeight: '30px', padding: '5px 0', border: '0', borderBottom: rule, background: 'transparent',\n        cursor: 'pointer', textAlign: 'left', color: '#0A0A0A',\n      });\n      row.innerHTML = '<span style=\"font-family:' + MONO + ';font-size:9.5px;letter-spacing:0.08em;color:#8A8880\">' + CODES[i] + '<\u002Fspan>'\n        + '<span style=\"font-family:' + MONO + ';font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase\">' + sec.dataset.sec + '<\u002Fspan>'\n        + '<span style=\"font-family:' + MONO + ';font-size:10.5px;color:' + AC() + '\">→<\u002Fspan>';\n      row.addEventListener('click', () => goTo(sec));\n      toc.appendChild(row);\n    });\n\n    const panel = q('#ixPanel'), sign = q('#ixSign');\n    secs.forEach((sec, i) => {\n      const row = document.createElement('button');\n      row.type = 'button';\n      Object.assign(row.style, {\n        display: 'flex', justifyContent: 'space-between', gap: '10px', width: '100%', minHeight: '34px',\n        padding: '0 10px', border: '0', borderBottom: rule, background: 'transparent', cursor: 'pointer',\n        fontFamily: MONO, fontSize: '10px', letterSpacing: '0.12em', textTransform: 'uppercase', color: '#0A0A0A',\n      });\n      row.innerHTML = '<span>' + CODES[i] + ' &nbsp; ' + sec.dataset.sec + '<\u002Fspan><span>→<\u002Fspan>';\n      row.addEventListener('click', () => { panel.style.display = 'none'; sign.textContent = '[+]'; goTo(sec); });\n      panel.appendChild(row);\n    });\n    q('#ixToggle').addEventListener('click', () => {\n      const open = panel.style.display !== 'none';\n      panel.style.display = open ? 'none' : 'block';\n      sign.textContent = open ? '[+]' : '[–]';\n    });\n\n    /* scroll spy on chips */\n    const chips = qa('#chips button');\n    const spy = () => {\n      const line = window.innerHeight * 0.32;\n      let idx = 0;\n      secs.forEach((s, i) => { if (s.getBoundingClientRect().top <= line) idx = i; });\n      chips.forEach((c, i) => {\n        const on = i === idx;\n        c.style.background = on ? AC() : 'transparent';\n        c.style.color = on ? '#fff' : '#0A0A0A';\n        c.style.borderColor = on ? AC() : '#0A0A0A';\n      });\n    };\n    /* parallax on the blurred field */\n    const blobs = qa('#bgfx > [data-p]');\n    let raf = 0;\n    const drift = () => {\n      raf = 0;\n      const span = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);\n      const t = Math.min(1, Math.max(0, window.scrollY / span));\n      blobs.forEach((b) => {\n        const p = parseFloat(b.dataset.p || '0'), x = parseFloat(b.dataset.x || '0');\n        const dy = Math.sin(t * Math.PI * 2 * Math.abs(p) + (p < 0 ? Math.PI : 0)) * 170 * Math.sign(p || 1);\n        const dx = Math.sin(t * Math.PI) * 240 * x * 8;\n        b.style.transform = 'translate3d(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px,0)';\n      });\n    };\n    void raf;\n    const token = String(Date.now());\n    root.dataset.loop = token;\n    let lastY = -1;\n    const update = () => {\n      const y = window.scrollY;\n      if (y === lastY) return;\n      lastY = y; spy(); drift();\n    };\n    const loop = () => {\n      if (!root.isConnected || root.dataset.loop !== token) return;\n      update();\n      requestAnimationFrame(loop);\n    };\n    if (root.__nkScroll) window.removeEventListener('scroll', root.__nkScroll);\n    root.__nkScroll = update;\n    window.addEventListener('scroll', update, { passive: true });\n    spy();\n    drift();\n    requestAnimationFrame(loop);\n\n    /* site filter: dim sections that do not match */\n    const siteq = q('#siteq');\n    siteq.addEventListener('input', () => {\n      const t = siteq.value.trim().toLowerCase();\n      secs.forEach((s) => {\n        const hit = !t || (s.textContent || '').toLowerCase().includes(t);\n        s.style.opacity = hit ? '1' : '0.22';\n      });\n    });\n\n    /* ── tiers ── */\n    const TIERS = [\n      ['05', 'Tower crowns and sky-bridges', '120–214 M / OFFICES, HOTEL BARS, FIVE GLAZED BRIDGES', 'Private above the twentieth floor, but the bridge network between the towers is public right of way, so you can walk five buildings without descending. Two hotel bars sell the view for the price of a drink.'],\n      ['04', 'Upper terrace', 'OBSERVATION DECKS, TERRACE CAFÉS, MOUNTAIN-SIDE BUS', 'Cut into the north wall, reached by lift, funicular or cable car. This is where visitors spend sunset and where the city looks most like its postcards.'],\n      ['03', 'Housing tiers', '1968 CONCRETE, SUB-RAIL STATIONS, MOST OF EVERYDAY LIFE', 'Nine in ten residents live on this level. Ground floors are shops, stairwells work as streets, and building numbers restart on every tier, which is why locals give directions by station.'],\n      ['02', 'Stacked expressways', 'FOUR ROAD DECKS AND A RAIL VIADUCT OVER THE SAME WATER', 'The Stacks interchange threads four levels of highway through the gorge inside a 200 m span. Walk the lower quay beneath it at dusk; the noise is extraordinary and so is the geometry.'],\n      ['01', 'River level', 'QUAYS, FERRIES, THE NIGHT MARKET, CARGO BARGES', 'Cool in summer, loud all year, cheapest place to eat. The quays flood most Marches, so everything down here is built to be hosed out.'],\n    ];\n    const tiersWrap = q('#tiers');\n    TIERS.forEach(([n, title, meta, note]) => {\n      const row = document.createElement('div');\n      Object.assign(row.style, { display: 'grid', gridTemplateColumns: '76px 1fr 24px', gap: '10px', padding: '11px 10px', borderBottom: rule, cursor: 'pointer' });\n      row.innerHTML = '<div style=\"font-weight:700;font-size:30px;line-height:0.78;letter-spacing:-0.06em;color:' + AC() + '\">' + n + '<\u002Fdiv>'\n        + '<div><div style=\"font-weight:700;font-size:15.5px;line-height:1.1;letter-spacing:-0.025em;text-transform:uppercase\">' + title + '<\u002Fdiv>'\n        + '<div style=\"font-family:' + MONO + ';font-size:10px;letter-spacing:0.06em;color:#8A8880;margin-top:3px\">' + meta + '<\u002Fdiv>'\n        + '<div data-note style=\"display:none;margin-top:8px;font-size:13.5px;line-height:1.6;max-width:70ch\">' + note + '<\u002Fdiv><\u002Fdiv>'\n        + '<div style=\"font-family:' + MONO + ';font-size:12.5px;color:#8A8880;text-align:right\">+<\u002Fdiv>';\n      row.addEventListener('click', () => {\n        const note2 = row.querySelector('[data-note]');\n        const open = note2.style.display !== 'none';\n        note2.style.display = open ? 'none' : 'block';\n        row.style.background = open ? '' : 'rgba(10,10,10,0.05)';\n        row.lastElementChild.textContent = open ? '+' : '–';\n      });\n      tiersWrap.appendChild(row);\n    });\n\n    /* ── ten places ── */\n    const PLACES = [\n      ['01', 'Skyline Terrace', 'VIEWPOINT', 'A public deck cantilevered off the third tier, level with the sky-bridges and just under the tower crowns, so the whole layered city stacks up in one view. Parasol cafés along the rail. The queue starts after six.', ['FREE, LIFT 4 KR', '45 MIN', 'SUNSET']],\n      ['02', 'The Upper Spine', 'ARCHITECTURE', 'Eight white-glass towers standing on brutalist podiums from the sixties, linked by five glazed bridges you can walk end to end without touching the ground. Two eras of Vesperia in one street.', ['FREE', '1 HOUR', 'WEEKDAY AM']],\n      ['03', 'The Stacks Interchange', 'LANDMARK', 'Four levels of expressway, two spiral ramps and a rail viaduct crossing the same 200 metres of gorge at different heights. Locals call it traffic. Photograph it from the north quay, where all four decks line up overhead.', ['FREE', '30 MIN', 'BLUE HOUR']],\n      ['04', 'Halstead Block Rail Cut', 'CURIOSITY', 'The sub-rail enters a nineteen-storey housing block at the sixth floor, crosses through it and leaves the other side. The platform sits inside the building and the residents above it are still at home.', ['FARE 6 KR', '20 MIN', 'OFF-PEAK']],\n      ['05', 'The Lantern Stairs', 'NEIGHBOURHOOD', 'Four hundred steps up the south wall, hung with paper lanterns, lined with family kitchens that open straight onto the staircase. Steep, uneven, the best eating in the city.', ['20–60 KR', '2 HOURS', 'AFTER 19:00']],\n      ['06', 'Kaelen Night Market', 'FOOD', 'Two hundred stalls set up under the lower expressway, so it runs whatever the weather does. River fish, hand-pulled noodles, cold pear wine, grill smoke lit orange from below. Bring small notes.', ['15–45 KR', '90 MIN', '19:00–01:00']],\n      ['07', 'Kaelen Cable Car', 'RIDE', 'Built for commuters, kept for the view: two cabins that lift you off the south bank, over the shipping channel and the interchange, to the north terrace. Ninety seconds, cheapest sightseeing in Vesperia.', ['12 KR RETURN', '20 MIN', 'DUSK']],\n      ['08', 'Old Customs Quarter', 'HISTORIC', 'Where the country began: an 1841 customs post at the river mouth, its yard, four stone warehouses and the original harbour light, all still standing under the towers that grew around them.', ['MUSEUM 30 KR', '1 HOUR', 'EST. 1841']],\n      ['09', 'Municipal Archive', 'MUSEUM', 'The civic record of Vesperia under a glass dome: the port, the 1968 housing programme, the terrace automation and what it did to the countryside. The lower vault is closed, and the staff say so plainly.', ['25 KR, FREE WED', '90 MIN', 'TUE–SUN']],\n      ['10', 'Pine Ridge Park', 'NATURE', 'The old-growth pine shelf at the foot of the north wall: twelve minutes from the towers and completely quiet. A graded trail, one pavilion, and the only place where you hear the river instead of the traffic.', ['FREE', '1–3 HOURS', 'EARLY AM']],\n    ];\n    const placesWrap = q('#places');\n    PLACES.forEach(([n, name, kind, body, tags], i) => {\n      const cell = document.createElement('article');\n      Object.assign(cell.style, { borderRight: rule, borderBottom: rule, padding: '12px 10px', background: i > 6 ? 'rgba(10,10,10,0.05)' : 'transparent' });\n      cell.innerHTML =\n        '<div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-bottom:6px;border-bottom:' + rule + '\">'\n        + '<span style=\"font-weight:700;font-size:30px;line-height:0.78;letter-spacing:-0.06em;color:' + (i > 6 ? '#0A0A0A' : AC()) + '\">' + n + '<\u002Fspan>'\n        + '<span style=\"font-family:' + MONO + ';font-size:9.5px;font-weight:600;letter-spacing:0.12em\">' + kind + '<\u002Fspan><\u002Fdiv>'\n        + '<h3 style=\"margin:8px 0 6px;font-weight:700;font-size:18px;line-height:1.05;letter-spacing:-0.03em;text-transform:uppercase\">' + name + '<\u002Fh3>'\n        + '<p style=\"margin:0 0 10px;font-size:13.5px;line-height:1.6\">' + body + '<\u002Fp>'\n        + '<div style=\"display:flex;flex-wrap:wrap;gap:4px;font-family:' + MONO + ';font-size:9.5px;letter-spacing:0.06em\">'\n        + tags.map((t) => '<span style=\"border:' + rule + ';padding:3px 6px\">' + t + '<\u002Fspan>').join('') + '<\u002Fdiv>';\n      placesWrap.appendChild(cell);\n    });\n\n    /* ── quarters ── */\n    const QUARTERS = [\n      ['A1', 'Apex Row', '05', 'Corporate glass', 'Sky-bridges, hotel bars, the best views'],\n      ['A2', 'North Terrace', '04', 'Visitor spine', 'Skyline Terrace, cable car, terrace cafés'],\n      ['B1', 'Halstead Tiers', '03', 'Concrete housing', 'The rail cut, morning bakeries, street life'],\n      ['B2', 'Lantern Slope', '02', 'Stair kitchens', 'Dinner, four hundred steps, lanterns'],\n      ['C1', 'South Quay', '01', 'Market and ferries', 'Night market, boat crossings, cheap beer'],\n      ['C2', 'Customs End', '01', 'Old stone', '1841 quarter, harbour light, warehouses'],\n      ['D1', 'Civic Block', '03', 'Institutional', 'Archive dome, libraries, quiet lunch'],\n      ['D2', 'Ridge Gate', '04', 'Forest edge', 'Pine Ridge Park, trails, the only silence'],\n    ];\n    const qWrap = q('#quarters');\n    const cols = '38px 1.5fr 44px 1fr 1.5fr';\n    const head = document.createElement('div');\n    Object.assign(head.style, { display: 'grid', gridTemplateColumns: cols, gap: '10px', padding: '7px 10px', background: '#0A0A0A', color: '#F2F1EE', fontFamily: MONO, fontSize: '10px', fontWeight: '600', letterSpacing: '0.14em', textTransform: 'uppercase' });\n    head.innerHTML = '<span>#<\u002Fspan><span>QUARTER<\u002Fspan><span>TIER<\u002Fspan><span>CHARACTER<\u002Fspan><span>GO FOR<\u002Fspan>';\n    qWrap.appendChild(head);\n    QUARTERS.forEach(([code, name, tier, ch, go]) => {\n      const row = document.createElement('div');\n      Object.assign(row.style, { display: 'grid', gridTemplateColumns: cols, gap: '10px', padding: '9px 10px', borderBottom: rule, fontSize: '13.5px', alignItems: 'center', cursor: 'pointer' });\n      row.innerHTML = '<span style=\"font-family:' + MONO + ';font-size:10.5px;color:#8A8880\">' + code + '<\u002Fspan>'\n        + '<span style=\"font-weight:700;text-transform:uppercase;letter-spacing:-0.02em\">' + name + '<\u002Fspan>'\n        + '<span style=\"font-family:' + MONO + ';font-size:10.5px;color:' + AC() + '\">' + tier + '<\u002Fspan>'\n        + '<span>' + ch + '<\u002Fspan><span>' + go + '<\u002Fspan>';\n      row.addEventListener('click', () => {\n        const on = row.dataset.on === '1';\n        Array.from(qWrap.children).forEach((o) => { if (o !== head) { o.style.background = ''; o.dataset.on = '0'; } });\n        if (!on) { row.style.background = 'rgba(10,10,10,0.05)'; row.dataset.on = '1'; }\n      });\n      qWrap.appendChild(row);\n    });\n\n    /* ── history ── */\n    const HISTORY = [\n      ['1841', 'The customs post', 'A tariff shed at the river mouth, built to tax the timber trade. The Old Customs Quarter still stands on the spot, now in the shadow of the Upper Spine.'],\n      ['1911', 'The deep-water port', 'Blasting the channel turned a fishing gorge into a trans-Pacific harbour. The rubble became the first river quays, which is why they are the oldest surfaces in the city.'],\n      ['1954', 'The Lantern Stairs', 'Dock workers cut a staircase up the south wall to reach cheap land above the flood line, and hung lanterns so the night shift could find its way home. The lanterns never came down.'],\n      ['1968', 'The housing programme', 'Eleven months, forty thousand flats, all in concrete on the mountain tiers. Grim in photographs, still lived in, and the reason the towers had podiums to stand on thirty years later.'],\n      ['1998', 'The archive dome', 'Built to hold the state record and sealed at the lower level in the same year, for reasons the museum\\u2019s own placard calls \"under review\". The upper galleries are excellent regardless.'],\n      ['2019', 'The vertical boom', 'Farm automation emptied the terraces inland and filled the capital in four years. The sky-bridges, the third expressway deck and most of what visitors photograph date from this rush.'],\n    ];\n    const hWrap = q('#history');\n    HISTORY.forEach(([year, title, body]) => {\n      const row = document.createElement('div');\n      Object.assign(row.style, { display: 'grid', gridTemplateColumns: '86px 1fr', gap: '10px', padding: '11px 10px', borderBottom: rule });\n      row.innerHTML = '<div style=\"font-weight:700;font-size:19px;line-height:0.9;letter-spacing:-0.04em;color:' + AC() + '\">' + year + '<\u002Fdiv>'\n        + '<div><div style=\"font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:-0.025em\">' + title + '<\u002Fdiv>'\n        + '<div style=\"font-size:13.5px;line-height:1.6;margin-top:3px;max-width:74ch\">' + body + '<\u002Fdiv><\u002Fdiv>';\n      hWrap.appendChild(row);\n    });\n\n    /* ── day planner ── */\n    const STOPS = [\n      { n: '01', name: 'Skyline Terrace', mins: 45, cost: 4, when: 18 },\n      { n: '02', name: 'The Upper Spine', mins: 60, cost: 0, when: 10 },\n      { n: '03', name: 'The Stacks Interchange', mins: 30, cost: 0, when: 20 },\n      { n: '04', name: 'Halstead Block Rail Cut', mins: 20, cost: 6, when: 11 },\n      { n: '05', name: 'The Lantern Stairs', mins: 120, cost: 45, when: 19 },\n      { n: '06', name: 'Kaelen Night Market', mins: 90, cost: 30, when: 21 },\n      { n: '07', name: 'Kaelen Cable Car', mins: 20, cost: 12, when: 17 },\n      { n: '08', name: 'Old Customs Quarter', mins: 60, cost: 30, when: 13 },\n      { n: '09', name: 'Municipal Archive', mins: 90, cost: 25, when: 14 },\n      { n: '10', name: 'Pine Ridge Park', mins: 120, cost: 0, when: 8 },\n    ];\n    const picked = new Set();\n    const picksWrap = q('#planpicks');\n    STOPS.forEach((s) => {\n      const b = document.createElement('button');\n      b.type = 'button';\n      b.dataset.n = s.n;\n      b.innerHTML = '<span style=\"font-family:' + MONO + ';font-size:10.5px;color:#8A8880\">' + s.n + '<\u002Fspan> ' + s.name.toUpperCase();\n      Object.assign(b.style, {\n        flex: '1 0 auto', display: 'flex', alignItems: 'center', gap: '8px', minHeight: '46px', padding: '0 12px',\n        border: '0', borderRight: rule, borderBottom: rule, background: 'transparent', color: '#0A0A0A',\n        cursor: 'pointer', fontFamily: \"'Tomorrow', sans-serif\", fontSize: '12.5px', fontWeight: '600',\n        letterSpacing: '-0.01em', whiteSpace: 'nowrap',\n      });\n      b.addEventListener('click', () => { if (picked.has(s.n)) picked.delete(s.n); else picked.add(s.n); paintPlan(); });\n      picksWrap.appendChild(b);\n    });\n    const fmt = (m) => { const h = Math.floor(m / 60), r = m % 60; return h ? h + ' h' + (r ? ' ' + r : '') : r + ' min'; };\n    const paintPlan = () => {\n      const chosen = STOPS.filter((s) => picked.has(s.n)).sort((a, b) => a.when - b.when);\n      qa('#planpicks button').forEach((b) => {\n        const on = picked.has(b.dataset.n);\n        b.style.background = on ? AC() : 'transparent';\n        b.style.color = on ? '#fff' : '#0A0A0A';\n        b.firstElementChild.style.color = on ? 'rgba(255,255,255,.7)' : '#8A8880';\n      });\n      const mins = chosen.reduce((t, s) => t + s.mins, 0);\n      const cost = chosen.reduce((t, s) => t + s.cost, 0) + (chosen.length >= 3 ? 28 : 0);\n      q('#planCount').textContent = String(chosen.length);\n      q('#planTime').textContent = chosen.length ? fmt(mins) : '0 h';\n      q('#planCost').textContent = cost + ' kr';\n      const v = q('#planVerdict');\n      v.textContent = !chosen.length ? 'Pick a stop' : mins <= 240 ? 'Half a day, easy pace' : mins <= 420 ? 'A full day, keep moving' : 'Too much, split it';\n      q('#planEmpty').style.display = chosen.length ? 'none' : 'block';\n      q('#planList').innerHTML = chosen.map((s) => '<li><span style=\"font-family:' + MONO + ';font-size:11px;color:#8A8880\">' + String(s.when).padStart(2, '0') + ':00<\u002Fspan> &nbsp;<strong>' + s.name + '<\u002Fstrong> <span style=\"font-family:' + MONO + ';font-size:11px;color:#8A8880\">' + fmt(s.mins) + (s.cost ? ', ' + s.cost + ' kr' : ', free') + '<\u002Fspan><\u002Fli>').join('');\n    };\n    q('#planReset').addEventListener('click', () => { picked.clear(); paintPlan(); });\n    paintPlan();\n\n    /* ── essential Kaelic dictionary ── */\n    const DICT = [\n      ['Salve-bon', 'SAL-veh BON', 'Hello', 'Any hour, any tier. Latin salve + French bon.'],\n      ['Bon-vale', 'bon VAH-leh', 'Goodbye', 'Said leaving a kitchen, a shop or a conversation.'],\n      ['Merci-vale', 'mer-SEE VAH-leh', 'Thank you', 'The whole city\\u2019s default courtesy.'],\n      ['S\\u2019il-plait', 'seel PLEH', 'Please', 'Tack it onto any order and you are fine.'],\n      ['Oui-est', 'wee EST', 'Yes', 'Nod with it; the nod is the important half.'],\n      ['Non-est', 'non EST', 'No', 'Flat, unbothered, never rude.'],\n      ['Pardon-me', 'par-DON mee', 'Excuse me', 'Also how you get past someone on the stairs.'],\n      ['Combien?', 'kom-BYEN', 'How much?', 'Market stalls expect it. Prices are rarely written.'],\n      ['Quelle statio?', 'kel STAH-tsyo', 'Which station?', 'The only direction question that works here.'],\n      ['Aqua, s\\u2019il-plait', 'AH-kwa seel PLEH', 'Water, please', 'Tap water is free and safe on every tier.'],\n      ['Aide-moi', 'ED mwah', 'Help me', 'Understood by transit staff and every stair kitchen.'],\n      ['Bon-via', 'bon VEE-ah', 'Safe travels', 'Said to you at the end. Say it back.'],\n    ];\n    const dict = q('#dict');\n    DICT.forEach(([word, say, en, note], i) => {\n      const row = document.createElement('button');\n      row.type = 'button';\n      Object.assign(row.style, {\n        display: 'grid', gridTemplateColumns: '38px 1.1fr 1fr auto', gap: '10px', alignItems: 'center', width: '100%',\n        minHeight: '52px', padding: '9px 10px', border: '0', borderBottom: rule, background: 'transparent',\n        cursor: 'pointer', textAlign: 'left', color: '#0A0A0A',\n      });\n      row.innerHTML = '<span style=\"font-family:' + MONO + ';font-size:9.5px;color:#8A8880\">' + String(i + 1).padStart(2, '0') + '<\u002Fspan>'\n        + '<span style=\"font-weight:700;font-size:15.5px;letter-spacing:-0.025em;text-transform:uppercase\">' + word + '<\u002Fspan>'\n        + '<span style=\"font-family:' + MONO + ';font-size:11px;letter-spacing:0.04em;text-transform:uppercase\">' + en + '<\u002Fspan>'\n        + '<span style=\"font-family:' + MONO + ';font-size:10.5px;color:#8A8880\">+<\u002Fspan>';\n      const drawer = document.createElement('div');\n      Object.assign(drawer.style, { display: 'none', padding: '0 10px 11px 58px', borderBottom: rule, background: 'rgba(10,10,10,0.05)' });\n      drawer.innerHTML = '<div style=\"font-family:' + MONO + ';font-size:11px;letter-spacing:0.06em;color:' + AC() + ';padding-top:9px\">/ ' + say + ' /<\u002Fdiv>'\n        + '<div style=\"font-size:13.5px;line-height:1.55;margin-top:4px;max-width:64ch\">' + note + '<\u002Fdiv>';\n      row.addEventListener('click', () => {\n        const open = drawer.style.display !== 'none';\n        drawer.style.display = open ? 'none' : 'block';\n        row.style.background = open ? 'transparent' : 'rgba(10,10,10,0.05)';\n        row.lastElementChild.textContent = open ? '+' : '–';\n      });\n      dict.appendChild(row);\n      dict.appendChild(drawer);\n    });\n\n    /* ── live city status ── */\n    const SERVICES = [\n      ['NIGHT MARKET', 19, 25, 'TIER 01 / SOUTH QUAY'],\n      ['SUB-RAIL', 5.33, 25.67, 'ALL TIERS'],\n      ['CABLE CAR', 7, 23, 'TIER 04'],\n      ['SKYLINE TERRACE', 6, 24, 'TIER 03'],\n      ['ARCHIVE DOME', 10, 18, 'TIER 03 / CIVIC'],\n      ['LANTERN STAIRS', 11, 25.5, 'TIER 02'],\n    ];\n    const liveGrid = q('#liveGrid');\n    SERVICES.forEach(([name, , , where]) => {\n      const cell = document.createElement('div');\n      Object.assign(cell.style, { padding: '9px 10px', borderRight: rule, borderBottom: rule });\n      cell.innerHTML = '<div style=\"font-family:' + MONO + ';font-size:9.5px;letter-spacing:0.12em;text-transform:uppercase;color:#8A8880\">' + name + '<\u002Fdiv>'\n        + '<div data-state style=\"font-weight:700;font-size:17px;letter-spacing:-0.02em;text-transform:uppercase;margin-top:3px\">...<\u002Fdiv>'\n        + '<div style=\"font-family:' + MONO + ';font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;color:#8A8880;margin-top:2px\">' + where + '<\u002Fdiv>';\n      liveGrid.appendChild(cell);\n    });\n    const pad = (n) => String(n).padStart(2, '0');\n    const TZ = 'America/Los_Angeles';\n    const PTF = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit', weekday: 'short', day: '2-digit', month: 'short' });\n    const pt = (d) => {\n      const o = {};\n      PTF.formatToParts(d || new Date()).forEach((p) => { o[p.type] = p.value; });\n      o.h = (parseInt(o.hour, 10) % 24) || 0;\n      o.m = parseInt(o.minute, 10);\n      o.s = parseInt(o.second, 10);\n      o.monthIndex = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'].indexOf(o.month.slice(0, 3));\n      return o;\n    };\n    const tickLive = () => {\n      const p = pt();\n      const hrs = p.h + p.m / 60;\n      q('#liveClock').textContent = pad(p.h) + ':' + pad(p.m) + ':' + pad(p.s);\n      q('#liveDate').textContent = (p.weekday + ' ' + p.day + ' ' + p.month).toUpperCase() + ' / PACIFIC NORTHWEST / GORGE HAZE 34';\n      q('#liveDot').style.opacity = p.s % 2 ? '0.25' : '1';\n      let openCount = 0;\n      Array.from(liveGrid.children).forEach((cell, i) => {\n        const [, from, to] = SERVICES[i];\n        const h2 = hrs < 6 ? hrs + 24 : hrs;\n        const on = (hrs >= from && hrs < to) || (h2 >= from && h2 < to);\n        if (on) openCount++;\n        const st = cell.querySelector('[data-state]');\n        st.textContent = on ? 'OPEN' : 'CLOSED';\n        st.style.color = on ? AC() : '#8A8880';\n      });\n      const nk = SERVICES[0];\n      const toMarket = ((19 - hrs) + 24) % 24;\n      q('#liveNext').innerHTML = '<span>' + openCount + ' / ' + SERVICES.length + ' SERVICES RUNNING RIGHT NOW<\u002Fspan>'\n        + '<span>NIGHT MARKET ' + (hrs >= 19 || hrs < 1 ? 'RUNNING, GO' : 'OPENS IN ' + Math.floor(toMarket) + ' H ' + Math.round((toMarket % 1) * 60) + ' M') + '<\u002Fspan>';\n      void nk;\n    };\n    tickLive();\n    this._liveTimer = setInterval(tickLive, 1000);\n\n    /* ── light window ── */\n    const MONTHS = [\n      ['JAN', '08:05', '15:52', '16:20', 'THE STACKS, NORTH QUAY', 'Low flat light all day, four hours of usable sun. The interchange photographs best because the de epeat';\n        cell.appendChild(mark);\n      });\n      cell.querySelector('[data-open]').addEventListener('click', () => openLb(i));\n      cell.querySelector('figcaption button').addEventListener('click', (e) => {\n        const b = e.currentTarget;\n        b.textContent = 'REQUESTED ✓';\n        b.style.color = AC();\n        b.style.textDecoration = 'none';\n      });\n      grid.appendChild(cell);\n    });\n    q('#galcount').textContent = String(GAL.length);\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
